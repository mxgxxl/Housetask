org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 9.0 defaults both flags below to true. This project still applies the
# classic "kotlin-android" plugin explicitly in app/build.gradle (old DSL
# style), which conflicts with AGP's new built-in Kotlin support and new
# public DSL interfaces. Flutter's own current project template ships these
# same two opt-outs for projects that haven't migrated off the classic
# kotlin-android plugin yet; they are scheduled for removal in AGP 10.0.
android.newDsl=false
android.builtInKotlin=false
