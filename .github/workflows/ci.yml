name: CI

# Railway already does continuous DEPLOYMENT (auto-deploy on push to main —
# see CLAUDE.md "Deployment"); this workflow is continuous INTEGRATION only:
# it verifies a push/PR before Railway ever sees it, it does not deploy
# anything itself.
on:
  push:
    branches: [main]
  pull_request:

# Cancel a still-running CI run for the same branch/PR the moment a new push
# supersedes it — the superseded run's minutes would otherwise burn for
# nothing (TD-008: keep this workflow lightweight to limit Actions cost).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path-based skip: a docs-only PR (e.g. #15, IMPROVEMENTS.md + PR template)
  # otherwise burns ~10 min running the full backend+frontend suites for
  # nothing. Each job's own filter list also includes this workflow file
  # itself, so an edit to ci.yml always re-runs both suites for verification
  # instead of trusting the change unverified.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # Documentation consistency (IMPROVEMENTS.md, 2026-08-17): AGENTS.md's
  # "read this first" links resolve, CLAUDE.md's short open-TD table agrees
  # with docs/TECH_DEBT.md, and the convention blocks AGENTS.md duplicates
  # from CLAUDE.md are still byte-identical.
  #
  # Deliberately NOT behind the `changes` filter above, unlike backend and
  # frontend: the drift this catches is caused precisely by docs-only edits,
  # which is exactly what a path filter would skip. Affordable because it is
  # pure bash — no toolchain to install, no cache to restore, no service
  # container, a few seconds per run (TD-008: keep this workflow lightweight).
  docs:
    name: Docs (links, TD registry, duplicated blocks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check_docs.sh

  backend:
    name: Backend (typecheck, build, test)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # matches backend/Dockerfile's node:20-alpine
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      # No MongoDB/Redis service container needed: the suite starts its own
      # in-memory MongoDB per run (mongodb-memory-server, see
      # src/tests/globalSetup.ts) and never contacts a real Redis — every
      # env var the tests need (JWT secrets, REDIS_COMMAND_TIMEOUT_MS) has an
      # in-repo default set in jest.config.js. No secrets required.
      - run: npm test

  frontend:
    name: Frontend (analyze, test, build apk)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # TD-041: pinned instead of relying on channel:stable alone — the
      # unpinned channel silently drifts Flutter's own Gradle/AGP/Kotlin
      # version floors forward, turning routine CI runs into surprise build
      # failures. Bump deliberately (and re-check those floors) when moving
      # this pin.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true # caches the Flutter SDK install itself

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # required by the Android Gradle build (apk)

      # Pub packages and Gradle's own caches are independent of the Flutter
      # SDK cache above — both are keyed off the lockfiles that would
      # invalidate them, with an OS-scoped fallback for a partial hit.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - run: flutter pub get

      # TD-041: fails in seconds if the pinned Flutter/Gradle/AGP/Kotlin
      # combination has drifted apart, instead of burning the rest of this
      # job's minutes on a build that was always going to hit the same
      # version-floor error. Placed here (not before checkout) because
      # `./gradlew` needs android/local.properties, which `flutter pub get`
      # generates — it does not exist yet any earlier in this job.
      - name: Verify Android build prerequisites
        run: |
          flutter --version
          cd android && ./gradlew --version

      # --no-fatal-infos: this Flutter version defaults --fatal-infos to ON,
      # so plain `flutter analyze` exits 1 purely from the repo's 11
      # pre-existing `info`-level lints (BuildContext-across-async-gaps,
      # deprecated Material members) — confirmed locally, not assumed.
      # --fatal-warnings stays on (its default), so this step is still
      # blocking for anything that actually matters.
      - run: flutter analyze --no-fatal-infos

      # TD-044: runs the full suite (test/ + test/widgets/) in one blocking
      # step. offline_banner_test.dart used to be carved out into its own
      # allow-failure step because it hung; TD-040 was root-caused and fixed
      # on 2026-08-17 (a real Hive write inside testWidgets' fake-async zone
      # deadlocked tearDown — never a host stall), so the carve-out is gone
      # and a regression there fails CI again instead of passing green. find
      # picks up new *_test.dart files automatically, so a future addition
      # under test/ or test/widgets/ needs no workflow edit to be covered.
      - name: Test — test/ and test/widgets/
        run: |
          mapfile -t files < <(find test -name "*_test.dart")
          flutter test "${files[@]}"

      # Android smoke test: ubuntu-latest ships the Android SDK pre-installed,
      # so this needs no extra setup beyond the JDK above.
      - run: flutter build apk --debug

  frontend-ios:
    name: Frontend iOS simulator build (main only)
    runs-on: macos-latest
    timeout-minutes: 25
    # macOS runner minutes cost several times more than Linux — restricted to
    # main so a PR never pays for it (TD-008: keep this workflow lightweight).
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9' # pinned (TD-041), see frontend job above
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get

      # Simulator build: no signing/provisioning needed at all — --no-codesign
      # makes that explicit rather than relying on --simulator's implicit skip.
      - run: flutter build ios --simulator --debug --no-codesign
