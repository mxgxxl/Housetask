buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // TD-049: Firebase config plugin. Requires google-services.json in
        // android/app/ (gitignored, manual setup) or the Android build fails.
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
