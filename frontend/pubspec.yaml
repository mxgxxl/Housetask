name: homesync
description: HomeSync - organize household tasks and shopping with your family.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1

  # Error tracking (TD-009) — no-op unless SENTRY_DSN is passed via --dart-define
  sentry_flutter: ^8.14.2

  # Local storage
  shared_preferences: ^2.2.3

  # UI / utils
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_slidable: ^3.1.0
  table_calendar: ^3.1.2
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
